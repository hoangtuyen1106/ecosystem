services:
  postgres:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pulsar:
    image: apachepulsar/pulsar
    command: >
      /pulsar/bin/pulsar standalone
    ports:
      - 6650:6650
    restart: always

  redis:
    image: redis
    ports:
      - '6379:6379'
    restart: always
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: